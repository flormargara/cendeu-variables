[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cendeu"
version = "0.1.0"
description = "Variables de comportamiento crediticio y scorecard a partir de la Central de Deudores del BCRA"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "duckdb>=1.3",
  "pandas>=2.0",
  "pyarrow>=14",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cendeu = "cendeu.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cendeu = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
